<svg id="pc-svg" viewBox="0 0 300 380">
              <!-- Chassis outer frame -->
              <rect id="vis-case-frame" x="15" y="15" width="270" height="350" rx="8" fill="var(--bg-subtle)" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="3,3" />
              <!-- PSU Shroud Area -->
              <rect x="20" y="312" width="260" height="48" fill="var(--surface)" stroke="var(--border)" stroke-dasharray="3,3" stroke-width="1" />

              <!-- Fan slots: exhaust LEFT side (rear), intake RIGHT side (front) -->
              <rect x="17" y="88" width="8" height="44" fill="transparent" stroke="var(--border)" stroke-width="0.7" stroke-dasharray="2,2" />
              <line x1="21" y1="90" x2="21" y2="130" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="1.5,2" />
              <rect x="275" y="78" width="8" height="50" fill="transparent" stroke="var(--border)" stroke-width="0.7" stroke-dasharray="2,2" />
              <line x1="279" y1="80" x2="279" y2="126" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="1.5,2" />
              <rect x="275" y="160" width="8" height="50" fill="transparent" stroke="var(--border)" stroke-width="0.7" stroke-dasharray="2,2" />
              <line x1="279" y1="162" x2="279" y2="208" stroke="var(--border)" stroke-width="0.4" stroke-dasharray="1.5,2" />

              <!-- 1. Motherboard -->
              <g id="vis-motherboard" class="vis-component hidden">
                <rect x="38" y="42" width="215" height="248" fill="transparent" stroke="var(--text-secondary)" stroke-width="1.5" stroke-dasharray="5,3" />
                <text x="145" y="168" class="vis-label" data-i18n="cat.motherboard">MB</text>
              </g>

              <!-- 2. CPU -->
              <g id="vis-cpu" class="vis-component hidden">
                <rect x="98" y="83" width="48" height="48" fill="var(--bg-subtle)" stroke="var(--text-primary)" stroke-width="1.5" />
                <text x="122" y="108" class="vis-label">CPU</text>
              </g>

              <!-- 3. RAM -->
              <g id="vis-ram" class="vis-component hidden">
                <rect x="158" y="50" width="7" height="65" fill="var(--surface)" stroke="var(--text-primary)" stroke-width="1" />
                <rect x="169" y="50" width="7" height="65" fill="var(--surface)" stroke="var(--text-primary)" stroke-width="1" />
                <text x="165" y="126" class="vis-label" style="font-size: 7px;">RAM</text>
              </g>

              <!-- 4. CPU Cooler -->
              <g id="vis-cooler" class="vis-component hidden">
                <!-- Air Cooler tower -->
                <g id="vis-cooler-air">
                  <rect x="83" y="68" width="78" height="78" fill="var(--surface)" stroke="var(--text-primary)" stroke-width="1" />
                  <line x1="93" y1="68" x2="93" y2="146" stroke="var(--border)" stroke-width="0.8" />
                  <line x1="103" y1="68" x2="103" y2="146" stroke="var(--border)" stroke-width="0.8" />
                  <line x1="113" y1="68" x2="113" y2="146" stroke="var(--border)" stroke-width="0.8" />
                  <line x1="123" y1="68" x2="123" y2="146" stroke="var(--border)" stroke-width="0.8" />
                  <line x1="133" y1="68" x2="133" y2="146" stroke="var(--border)" stroke-width="0.8" />
                  <line x1="143" y1="68" x2="143" y2="146" stroke="var(--border)" stroke-width="0.8" />
                  <text x="122" y="107" class="vis-label" style="font-size: 7.5px;">COOLER (AIR)</text>
                </g>
                <!-- AIO Liquid Cooler -->
                <g id="vis-cooler-aio" class="hidden">
                  <rect x="42" y="18" width="200" height="16" fill="var(--surface)" stroke="var(--text-primary)" stroke-width="1" />
                  <line x1="42" y1="26" x2="242" y2="26" stroke="var(--border)" stroke-width="0.7" stroke-dasharray="2,2" />
                  <text x="142" y="28" class="vis-label" style="font-size: 5.5px;">LIQUID RADIATOR</text>
                  <circle cx="122" cy="107" r="15" fill="var(--bg-subtle)" stroke="var(--text-primary)" stroke-width="1" />
                  <text x="122" y="107" class="vis-label" style="font-size: 6px;">PUMP</text>
                  <path d="M 115 93 C 108 55, 85 40, 72 34" fill="none" stroke="var(--text-secondary)" stroke-width="1.2" />
                  <path d="M 130 93 C 138 55, 160 40, 178 34" fill="none" stroke="var(--text-secondary)" stroke-width="1.2" />
                </g>
              </g>

              <!-- 5. GPU -->
              <g id="vis-gpu" class="vis-component hidden">
                <rect x="28" y="178" width="220" height="52" rx="2" fill="var(--bg-subtle)" stroke="var(--text-primary)" stroke-width="1.5" />
                <line x1="28" y1="204" x2="248" y2="204" stroke="var(--border)" stroke-width="1" />
                <rect x="240" y="186" width="5" height="30" fill="transparent" stroke="var(--border)" stroke-width="0.7" />
                <text x="138" y="214" class="vis-label">GPU</text>
              </g>

              <!-- 6. SSD M.2 slot -->
              <g id="vis-ssd" class="vis-component hidden">
                <rect x="148" y="155" width="35" height="10" rx="1" fill="transparent" stroke="var(--text-tertiary)" stroke-width="1" />
                <text x="165" y="163" class="vis-label" style="font-size: 7px;">M.2 SSD</text>
              </g>

              <!-- 7. HDD drive bay -->
              <g id="vis-hdd" class="vis-component hidden">
                <rect x="210" y="320" width="60" height="30" rx="2" fill="transparent" stroke="var(--text-tertiary)" stroke-width="1" />
                <text x="240" y="338" class="vis-label" style="font-size: 7px;">HDD</text>
              </g>

              <!-- 8. PSU -->
              <g id="vis-psu" class="vis-component hidden">
                <rect x="28" y="320" width="92" height="34" rx="2" fill="var(--bg-subtle)" stroke="var(--text-primary)" stroke-width="1.5" />
                <circle cx="74" cy="337" r="10" fill="transparent" stroke="var(--border)" stroke-width="1" />
                <text x="74" y="340" class="vis-label" style="font-size: 8px;">PSU</text>
              </g>
            </svg>
